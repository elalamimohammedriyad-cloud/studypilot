<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyPilot | Professional Courses</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#080b14;color:white}
header{height:80px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202638}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.logo span{color:#2878ff}
nav{display:flex;gap:25px;align-items:center}
a{color:white;text-decoration:none}
nav a:hover{color:#3985ff}
button{cursor:pointer;border:0}
.lang{background:#18243b;color:white;padding:10px 15px;border-radius:8px}
.hero{text-align:center;padding:75px 20px 45px}
.hero h1{font-size:45px;margin-bottom:15px}
.hero h1 span{color:#347fff}
.hero p{color:#aab4c8;font-size:17px;line-height:1.6}
.search{margin:30px auto 15px;max-width:520px}
.search input{width:100%;padding:16px;border-radius:10px;border:1px solid #303d55;background:#111827;color:white;font-size:15px}
.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:15px}
.filters button{padding:11px 17px;border-radius:25px;background:#151e30;color:#cbd5e1}
.filters button.active,.filters button:hover{background:#2878ff;color:white}
.section{padding:35px 8% 80px}
.section h2{font-size:27px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:22px}
.card{background:#111827;border:1px solid #263248;border-radius:15px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-6px);border-color:#347fff}
.icon{height:145px;display:flex;align-items:center;justify-content:center;font-size:58px;background:linear-gradient(135deg,#132b52,#17213a)}
.content{padding:22px}
.tag{font-size:11px;color:#60a0ff;text-transform:uppercase;font-weight:bold;letter-spacing:1px}
.content h3{font-size:19px;margin:12px 0}
.content p{font-size:13px;color:#aab4c8;line-height:1.6;min-height:42px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.price{font-size:20px;font-weight:bold}
.free{color:#39d98a}
.paid{color:#69a3ff}
.details{background:#2878ff;color:white;padding:11px 15px;border-radius:7px;font-weight:bold}
.details:hover{background:#1260df}
.empty{text-align:center;color:#9ba8bd;padding:40px;display:none}
footer{padding:35px;text-align:center;color:#8490a5;border-top:1px solid #202638}
.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal-box{background:#121c30;border:1px solid #34435d;border-radius:16px;padding:30px;max-width:480px;width:100%}
.modal-box h2{margin-bottom:15px}
.modal-box p{color:#b4bfd1;line-height:1.7;margin-bottom:20px}
.close{float:right;background:#263650;color:white;padding:8px 12px;border-radius:6px}
@media(max-width:600px){header{padding:0 5%}nav{gap:12px}.hero h1{font-size:33px}.section{padding:30px 5%}}
</style>
</head>
<body>

<header>
<a href="index.html" class="logo">STUDY<span>PILOT</span></a>
<nav>
<a href="index.html" data-en="Home" data-fr="Accueil">Home</a>
<a href="#courses" data-en="Courses" data-fr="Formations">Courses</a>
<button class="lang" onclick="toggleLang()">FR / EN</button>
</nav>
</header>

<section class="hero">
<h1 data-en="Explore Your <span>Potential</span>" data-fr="Explorez votre <span>Potentiel</span>">Explore Your <span>Potential</span></h1>
<p data-en="Learn new skills. Build your future. Create new opportunities." data-fr="Apprenez de nouvelles compétences. Construisez votre avenir. Créez de nouvelles opportunités.">Learn new skills. Build your future. Create new opportunities.</p>
<div class="search">
<input type="text" id="search" placeholder="Search for a course..." oninput="filterCourses()">
</div>
</section>

<div class="filters">
<button class="active" onclick="setFilter('all',this)" data-en="All" data-fr="Tout">All</button>
<button onclick="setFilter('professional',this)">Professional</button>
<button onclick="setFilter('ai',this)">AI & Innovation</button>
<button onclick="setFilter('business',this)">Business</button>
<button onclick="setFilter('digital',this)">Digital Skills</button>
<button onclick="setFilter('finance',this)">Finance</button>
<button onclick="setFilter('creative',this)">Creative Studio</button>
</div>

<section class="section" id="courses">
<h2 data-en="Discover Our Courses" data-fr="Découvrez nos formations">Discover Our Courses</h2>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">No courses found.</div>
</section>

<div class="modal" id="modal">
<div class="modal-box">
<button class="close" onclick="closeModal()">✕</button>
<h2 id="modalTitle"></h2>
<p id="modalDescription"></p>
<h3 id="modalPrice"></h3>
<br>
<button class="details" onclick="alert(currentLang==='en'?'Enrollment coming soon!':'Inscriptions bientôt disponibles !')" data-en="Enroll Now" data-fr="S'inscrire">Enroll Now</button>
</div>
</div>

<footer>
STUDYPILOT © 2026 — Learn. Build. Grow.
</footer>

<script>
let currentLang='en';
let currentFilter='all';

const courses=[
{title:'AI Skills for Beginners',category:'ai',icon:'🤖',price:'FREE',description:'Discover artificial intelligence and learn how to use modern AI tools.'},
{title:'Prompt Engineering',category:'ai',icon:'💡',price:'$14.99',description:'Master the art of writing effective prompts and getting better AI results.'},
{title:'From Idea to Business',category:'business',icon:'🚀',price:'$19.99',description:'Turn your ideas into real business projects and learn the basics of entrepreneurship.'},
{title:'Start an Online Business',category:'business',icon:'💼',price:'$29.99',description:'Discover how to build and develop your own online business.'},
{title:'Create Your First Website',category:'digital',icon:'💻',price:'$24.99',description:'Learn the fundamentals of web development and create your first website.'},
{title:'Digital Marketing',category:'professional',icon:'📈',price:'$24.99',description:'Understand digital marketing, social media and online growth strategies.'},
{title:'Graphic Design with Canva',category:'creative',icon:'🎨',price:'$14.99',description:'Learn design principles and create professional visual content.'},
{title:'Personal Finance',category:'finance',icon:'💰',price:'$19.99',description:'Understand budgeting, saving, financial planning and money management.'}
];

function renderCourses(){
let search=document.getElementById('search').value.toLowerCase();
let filtered=courses.filter(c=>(currentFilter==='all'||c.category===currentFilter)&&c.title.toLowerCase().includes(search));
document.getElementById('grid').innerHTML=filtered.map((c,i)=>`
<div class="card">
<div class="icon">${c.icon}</div>
<div class="content">
<span class="tag">${c.category}</span>
<h3>${c.title}</h3>
<p>${c.description}</p>
<div class="bottom">
<span class="price ${c.price==='FREE'?'free':'paid'}">${c.price}</span>
<button class="details" onclick="openModal('${c.title}')">${currentLang==='en'?'Discover':'Découvrir'}</button>
</div>
</div>
</div>`).join('');
document.getElementById('empty').style.display=filtered.length?'none':'block';
}

function setFilter(filter,btn){
currentFilter=filter;
document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderCourses();
}

function filterCourses(){renderCourses()}

let currentCourse=null;

function openModal(title){
currentCourse=courses.find(c=>c.title===title);
document.getElementById('modalTitle').textContent=currentCourse.title;
document.getElementById('modalDescription').textContent=currentCourse.description;
document.getElementById('modalPrice').textContent=currentCourse.price;
document.getElementById('modal').style.display='flex';
}

function closeModal(){document.getElementById('modal').style.display='none'}

function toggleLang(){
currentLang=currentLang==='en'?'fr':'en';
document.querySelectorAll('[data-en]').forEach(el=>el.innerHTML=el.getAttribute('data-'+currentLang));
document.getElementById('search').placeholder=currentLang==='en'?'Search for a course...':'Rechercher une formation...';
renderCourses();
}

renderCourses();
</script>
</body>
</html>
